bundle:
  name: huvibar-construction-demo
  engine: direct

variables:
  catalog:
    description: Unity Catalog catalog name
    default: css_genie
  warehouse_id:
    description: SQL warehouse ID for dashboard & Genie deployment
    default: dd4b2d284ed5f3f6

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://adb-7405605962645785.5.azuredatabricks.net
      profile: css-genie-demo

  prod:
    mode: production
    workspace:
      host: https://adb-7405605962645785.5.azuredatabricks.net
      profile: css-genie-demo

include:
  - resources/jobs/*.yml
  - resources/genie_spaces/*.yml
  - resources/apps/*.yml
  - dashboards/*.yml
