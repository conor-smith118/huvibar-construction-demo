resources:
  genie_spaces:
    huvibar_billables:
      title: "Huvibar | Billables & Invoicing"
      description: "Accounts receivable aging, invoice tracking, time-and-material billing, and change order billings across all Huvibar projects."
      warehouse_id: ${var.warehouse_id}
      serialized_space:
        version: 2
        config:
          sample_questions:
            - id: "7296456ce224403da821ef129a0c1f82"
              question:
                - "What's our total accounts receivable balance right now?"
            - id: "4618e17d1de54b07909277ef1d2f8ad6"
              question:
                - "Which invoices are more than 60 days overdue?"
            - id: "62a86f03192b409eb4e69fd714bc4b81"
              question:
                - "How much unbilled T&M work do we have approved but not yet invoiced?"
        data_sources:
          tables:
            - identifier: "css_genie.billables.change_order_billings"
              description:
                - "Billing records for approved change orders. Key fields: co_billing_id, project_id, change_order_id, billed_amount, invoice_id, billing_date, status."
            - identifier: "css_genie.billables.invoice_line_items"
              description:
                - "Line items associated with each invoice. Key fields: line_item_id, invoice_id, description, quantity, unit_price, line_total, cost_code, billing_type."
            - identifier: "css_genie.billables.invoices"
              description:
                - "Invoice header records. Key fields: invoice_id, project_id, invoice_number, invoice_date, due_date, amount, status, days_outstanding. Status values: draft, sent, partial, paid, overdue."
            - identifier: "css_genie.billables.time_and_material_tickets"
              description:
                - "T&M field tickets recording billable labor and material. Key fields: ticket_id, project_id, ticket_date, description, labor_hours, labor_rate, material_cost, total_amount, status, invoice_id. Status values: pending, approved, invoiced, rejected."
            - identifier: "css_genie.project_tracking.projects"
              description:
                - "Master project list. Key fields: project_id, project_name, status, contract_value, project_type, start_date, end_date, project_manager."
        instructions:
          text_instructions:
            - id: "ee34b1f56a1b4b4e847e89548874ba67"
              content:
                - "You are a billables and accounts receivable analytics assistant for Huvibar Construction. Huvibar bills clients through formal invoices, time-and-material (T&M) tickets, and change order billings."
                - "BILLING TYPES: Lump sum contract billing flows through the invoices table. T&M work (extra scope, directed changes) flows through time_and_material_tickets before being rolled into invoices. Change order billings are tracked separately in change_order_billings and linked to invoices via invoice_id once billed."
                - "AR AGING BUCKETS: Standard construction AR aging uses days_outstanding: 0-30 days (current), 31-60 days (watch), 61-90 days (at risk), 90+ days (critical). Use CASE WHEN logic on days_outstanding to bucket invoices. Total AR balance = SUM(amount) WHERE status NOT IN ('paid', 'draft')."
                - "UNBILLED T&M: T&M tickets with status='approved' and invoice_id IS NULL represent work completed and approved but not yet billed. This is a key metric — it shows revenue that can be invoiced immediately."
                - "KEY METRICS: AR balance by project = SUM(amount) WHERE status IN ('sent','partial','overdue'). Overdue invoices = WHERE status='overdue' OR (due_date < current_date() AND status NOT IN ('paid','draft')). Unbilled T&M = SUM(total_amount) WHERE status='approved' AND invoice_id IS NULL."
                - "ANSWERING GUIDANCE: Always JOIN invoices to css_genie.project_tracking.projects on project_id for named project context. For AR aging, use days_outstanding from the invoices table directly rather than computing from dates. Change order billings require joining to projects for project names."
