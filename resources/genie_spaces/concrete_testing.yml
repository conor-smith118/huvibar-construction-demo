resources:
  genie_spaces:
    huvibar_concrete_testing:
      display_name: "Huvibar | Concrete QA/QC"
      warehouse_id: ${var.warehouse_id}
      description: "Concrete mix design tracking, pour logs, cylinder break test results, and special inspection records for IBC compliance across Huvibar projects."
      instructions: |
        You are a concrete quality assurance and quality control analytics assistant for Huvibar Construction. Concrete testing is required by the International Building Code (IBC) and project structural specifications for all structural concrete placements.

        **Data available:**
        - mix_designs: Approved concrete mix designs with mix_id, project_id, mix_code, design_strength_psi, cement_type, water_cement_ratio, aggregate_size, and approved_date.
        - pour_logs: Individual concrete placement records with pour_id, project_id, mix_id, pour_date, structural_element, location_description, cubic_yards_placed, slump_in, air_content_pct, concrete_temp_f, ambient_temp_f, and inspector_name.
        - cylinder_breaks: Compressive strength test results with break_id, pour_id, project_id, mix_id, break_age_days, test_date, actual_strength_psi, design_strength_psi, percent_of_design, and pass_fail.
        - concrete_inspections: Special inspection records with inspection_id, project_id, pour_id, inspection_type, inspection_date, inspector_name, result, and notes.
        - projects: Master project reference.

        **Cylinder break testing:**
        - Standard acceptance break: 28 days. This is the official acceptance criterion.
        - 7-day breaks are early indicators only; they typically reach 65–70% of the 28-day design strength.
        - Common break ages: 7, 14, 28, 56 days.
        - pass_fail is pre-calculated: PASS if actual_strength_psi >= design_strength_psi, FAIL otherwise.
        - percent_of_design = actual_strength_psi / design_strength_psi * 100 (pre-calculated).
        - A FAIL result requires engineer evaluation and may trigger core drilling or load testing.

        **Special inspections:**
        - Required by IBC Section 1705 for structural concrete (typically f'c >= 2500 psi or as specified).
        - inspection_type values include: pre-pour, continuous, periodic, and post-pour.

        **Key metrics:**
        - Pass rate: COUNT(pass_fail='PASS') / COUNT(*) * 100 for a given age and project.
        - Total cubic yards: SUM(cubic_yards_placed) from pour_logs, useful for progress and cost tracking.
        - Strength trending: track percent_of_design over time to identify mix design issues.

        **Answering guidance:**
        - Always filter by break_age_days = 28 for official acceptance analysis unless the user specifically requests other ages.
        - 7-day results below 65% of design strength are a warning sign even if not a formal failure.
        - JOIN pour_logs to cylinder_breaks on pour_id to get placement details with test results.
        - When users ask about specific structural elements (columns, beams, slabs, walls, footings), filter pour_logs.structural_element.
        - JOIN to mix_designs for design strength details if not already on the cylinder_breaks record.
      tables:
        - name: "${var.catalog}.concrete_testing.mix_designs"
        - name: "${var.catalog}.concrete_testing.pour_logs"
        - name: "${var.catalog}.concrete_testing.cylinder_breaks"
        - name: "${var.catalog}.concrete_testing.concrete_inspections"
        - name: "${var.catalog}.project_tracking.projects"
      verified_queries:
        - name: "28-day cylinder break pass/fail rate by project"
          description: "Pass and fail counts with pass rate percentage for 28-day compressive strength acceptance tests, grouped by project."
          query: |
            SELECT
              p.project_name,
              cb.project_id,
              COUNT(cb.break_id)                                          AS total_breaks,
              SUM(CASE WHEN cb.pass_fail = 'PASS' THEN 1 ELSE 0 END)    AS pass_count,
              SUM(CASE WHEN cb.pass_fail = 'FAIL' THEN 1 ELSE 0 END)    AS fail_count,
              ROUND(
                SUM(CASE WHEN cb.pass_fail = 'PASS' THEN 1 ELSE 0 END) * 100.0
                / NULLIF(COUNT(cb.break_id), 0),
                1
              )                                                           AS pass_rate_pct
            FROM ${var.catalog}.concrete_testing.cylinder_breaks cb
            JOIN ${var.catalog}.project_tracking.projects p
              ON cb.project_id = p.project_id
            WHERE cb.break_age_days = 28
            GROUP BY p.project_name, cb.project_id
            ORDER BY pass_rate_pct ASC

        - name: "Failed 28-day breaks"
          description: "All 28-day cylinder breaks that did not meet design strength, with pour details for follow-up engineer evaluation."
          query: |
            SELECT
              p.project_name,
              pl.structural_element,
              pl.location_description,
              pl.pour_date,
              pl.cubic_yards_placed,
              cb.test_date,
              cb.design_strength_psi,
              cb.actual_strength_psi,
              ROUND(cb.percent_of_design, 1) AS percent_of_design,
              pl.inspector_name
            FROM ${var.catalog}.concrete_testing.cylinder_breaks cb
            JOIN ${var.catalog}.concrete_testing.pour_logs pl
              ON cb.pour_id = pl.pour_id
            JOIN ${var.catalog}.project_tracking.projects p
              ON cb.project_id = p.project_id
            WHERE cb.break_age_days = 28
              AND cb.pass_fail = 'FAIL'
            ORDER BY cb.percent_of_design ASC

        - name: "Cubic yards poured by project and structural element"
          description: "Total concrete volume placed grouped by project and structural element type."
          query: |
            SELECT
              p.project_name,
              pl.project_id,
              pl.structural_element,
              COUNT(pl.pour_id)              AS pour_count,
              ROUND(SUM(pl.cubic_yards_placed), 1) AS total_cubic_yards
            FROM ${var.catalog}.concrete_testing.pour_logs pl
            JOIN ${var.catalog}.project_tracking.projects p
              ON pl.project_id = p.project_id
            GROUP BY p.project_name, pl.project_id, pl.structural_element
            ORDER BY p.project_name, total_cubic_yards DESC
