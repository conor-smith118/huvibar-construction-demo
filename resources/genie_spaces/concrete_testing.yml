resources:
  genie_spaces:
    huvibar_concrete_testing:
      title: "Concrete QA-QC"
      description: "Concrete mix design tracking, pour logs, cylinder break test results, and special inspection records for IBC compliance across Huvibar projects."
      warehouse_id: ${var.warehouse_id}
      serialized_space:
        version: 2
        config:
          sample_questions:
            - id: "34527ce0303e461fadb76ea595e5d1f6"
              question:
                - "What is the cylinder break pass rate for each project?"
            - id: "1c7d74d6ec5740c79b697beceb255be5"
              question:
                - "Show me all failed 28-day cylinder breaks"
            - id: "bfbd5b9d4c8140408cd31d79c02e8001"
              question:
                - "How many cubic yards of concrete have been placed by project and structural element?"
        data_sources:
          tables:
            - identifier: "css_genie.concrete_testing.concrete_inspections"
              description:
                - "Special inspection records. Key fields: inspection_id, project_id, pour_id, inspection_type, inspection_date, inspector_name, result, notes. inspection_type values: pre-pour, continuous, periodic, post-pour."
            - identifier: "css_genie.concrete_testing.cylinder_breaks"
              description:
                - "Compressive strength test results. Key fields: break_id, pour_id, project_id, mix_id, break_age_days, test_date, actual_strength_psi, design_strength_psi, percent_of_design (pre-calculated), pass_fail (pre-calculated: PASS if actual >= design)."
            - identifier: "css_genie.concrete_testing.mix_designs"
              description:
                - "Approved concrete mix designs. Key fields: mix_id, project_id, mix_code, design_strength_psi, cement_type, water_cement_ratio, aggregate_size, approved_date."
            - identifier: "css_genie.concrete_testing.pour_logs"
              description:
                - "Individual concrete placement records. Key fields: pour_id, project_id, mix_id, pour_date, structural_element, location_description, cubic_yards_placed, slump_in, air_content_pct, concrete_temp_f, ambient_temp_f, inspector_name."
            - identifier: "css_genie.project_tracking.projects"
              description:
                - "Master project list. Key fields: project_id, project_name, status, contract_value, project_type, start_date, end_date, project_manager."
        instructions:
          text_instructions:
            - id: "7331630419574ff0a2434eb97d0d4631"
              content:
                - "You are a concrete quality assurance and quality control analytics assistant for Huvibar Construction. Concrete testing is required by the International Building Code (IBC) and project structural specifications for all structural concrete placements."
                - "CYLINDER BREAK TESTING: The official acceptance criterion is the 28-day compressive strength test. 7-day breaks are early indicators only — they typically reach 65-70% of 28-day design strength. Common break ages: 7, 14, 28, 56 days. Always filter by break_age_days = 28 for official acceptance analysis unless the user specifically requests other ages."
                - "PASS-FAIL LOGIC: pass_fail is pre-calculated on the cylinder_breaks table — PASS if actual_strength_psi >= design_strength_psi, FAIL otherwise. percent_of_design = actual_strength_psi divided by design_strength_psi * 100 (also pre-calculated). A FAIL result requires engineer evaluation and may trigger core drilling or load testing."
                - "SPECIAL INSPECTIONS: Required by IBC Section 1705 for structural concrete (typically f'c >= 2500 psi or as specified by the engineer of record). inspection_type values: pre-pour (pre-placement inspection), continuous (inspector present throughout pour), periodic (intermittent checks), post-pour (placement records review)."
                - "KEY METRICS: Pass rate = COUNT(pass_fail=PASS) * 100 divided by total COUNT for a given age and project. Total CY placed = SUM(cubic_yards_placed) from pour_logs — useful for progress and cost tracking. Strength trend = track percent_of_design over time to identify mix design or placement issues."
                - "ANSWERING GUIDANCE: JOIN pour_logs to cylinder_breaks on pour_id to get placement details alongside test results. When users ask about specific structural elements (columns, beams, slabs, walls, footings), filter pour_logs.structural_element. 7-day results below 65% of design strength are a warning sign even if not a formal FAIL. For project context, always JOIN to css_genie.project_tracking.projects on project_id."
