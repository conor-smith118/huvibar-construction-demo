resources:
  genie_spaces:
    huvibar_contracts:
      title: "Huvibar | Contract Management"
      description: "Prime contract, subcontract, and purchase order management including insurance verification, bonding compliance, change order exposure, and delivery tracking."
      warehouse_id: ${var.warehouse_id}
      serialized_space:
        version: 2
        config:
          sample_questions:
            - id: "776816847fea4ac2a973b7eb59e05965"
              question:
                - "Which subcontractors have insurance expiring in the next 30 days?"
            - id: "0d024126cb5746fcbd7ebc9010b2a890"
              question:
                - "What's the total value of approved change orders by project?"
            - id: "ef1b55fd2ba246fc8108710e3e729b91"
              question:
                - "Show me all open purchase orders with expected delivery dates that have passed"
        data_sources:
          tables:
            - identifier: "css_genie.contracts.contract_amendments"
              description:
                - "Modifications to contracts and subcontracts. Key fields: amendment_id, contract_id, subcontract_id, project_id, description, amount, executed_date, status. Positive amount = scope addition. Negative = credit. Only status='approved' amendments are reflected in current contract values."
            - identifier: "css_genie.contracts.prime_contracts"
              description:
                - "Owner agreements. Key fields: contract_id, project_id, contract_type, original_amount, executed_date, notes. Contract types: GMP, Lump Sum, T&M, Unit Price."
            - identifier: "css_genie.contracts.purchase_orders"
              description:
                - "Material and equipment orders. Key fields: po_id, project_id, vendor, po_amount, issue_date, required_delivery_date, actual_delivery_date, status. Status values: issued, partial_receipt, received, paid, cancelled."
            - identifier: "css_genie.contracts.subcontracts"
              description:
                - "Subcontractor agreements. Key fields: subcontract_id, project_id, sub_id, scope_description, original_value, current_value, execution_date, insurance_verified_date, bond_required, bond_amount, status."
            - identifier: "css_genie.project_tracking.projects"
              description:
                - "Master project list. Key fields: project_id, project_name, status, contract_value, project_type, start_date, end_date, project_manager."
            - identifier: "css_genie.project_tracking.subcontractors"
              description:
                - "Subcontractor master record. Key fields: sub_id, company_name, trade, tier, insurance_expiry, bond_company, status."
        instructions:
          text_instructions:
            - id: "8504db6795f94941bbe9e7b10f29276c"
              content:
                - "You are a contract management analytics assistant for Huvibar Construction. This space covers all contractual relationships: prime contracts with owners, subcontracts with specialty contractors, and purchase orders for materials and equipment."
                - "CONTRACT TYPES: GMP (Guaranteed Maximum Price) is most common for Huvibar's larger projects — owner cost is capped and savings are shared. Lump Sum = fixed price, Huvibar bears all cost risk. T&M = time and material, cost-reimbursable. Unit Price = priced per unit of work."
                - "SUBCONTRACT COMPLIANCE: Insurance must be verified annually. insurance_expiry on the subcontractors table is the formal expiry date. Bonds are required on subcontracts over $250K — flag records where current_value > 250000 AND (bond_required = false OR bond_on_file = false)."
                - "PURCHASE ORDER STATUS: issued → partial_receipt → received → paid (or cancelled). A PO is overdue when required_delivery_date < current_date() AND actual_delivery_date IS NULL AND status NOT IN ('received', 'paid', 'cancelled')."
                - "CONTRACT AMENDMENTS: amount > 0 = scope addition (increases contract value). amount < 0 = credit or deduction. Only status='approved' amendments are reflected in current contract values. Pending amendments represent unbooked exposure."
                - "ANSWERING GUIDANCE: For insurance expiration, use insurance_expiry from the subcontractors table and compare to current_date() + 30 days using date_add(current_date(), 30). For change order totals by project, SUM(amount) from contract_amendments WHERE status='approved' GROUP BY project_id. Always JOIN subcontractors to get company names from subcontract records."
