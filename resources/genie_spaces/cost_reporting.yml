resources:
  genie_spaces:
    huvibar_cost_reporting:
      title: "Huvibar | Cost Reporting & Forecasting"
      description: "Budget vs. actual vs. forecast cost control, EAC variance analysis, change order exposure, and monthly burn rate reporting across Huvibar projects."
      warehouse_id: ${var.warehouse_id}
      serialized_space:
        version: 2
        config:
          sample_questions:
            - id: "b46ba44b731d4451894147ca10d24d28"
              question:
                - "Which projects are over budget and by how much?"
            - id: "1b72de28214d40e48e4b44617a53bdcc"
              question:
                - "What is our total burn rate over the last 3 months?"
            - id: "5040f547c51e4b218839b5703b9cc6d6"
              question:
                - "Show me the top 10 cost overruns by cost code"
        data_sources:
          tables:
            - identifier: "css_genie.cost_reporting.actual_costs"
              description:
                - "Posted cost transactions. Key fields: project_id, cost_code_id, cost_type, transaction_date, amount, vendor, description."
            - identifier: "css_genie.cost_reporting.budget_line_items"
              description:
                - "Original and revised budget by project and cost code. Key fields: project_id, cost_code_id, cost_type, original_budget, approved_changes, current_budget."
            - identifier: "css_genie.cost_reporting.change_orders"
              description:
                - "Owner change orders affecting budget. Key fields: project_id, co_number, description, amount, status, approved_date. Only status='approved' change orders are reflected in current_budget."
            - identifier: "css_genie.cost_reporting.committed_costs"
              description:
                - "Subcontract and purchase order commitments. Key fields: project_id, cost_code_id, commitment_type, vendor, committed_amount, invoiced_to_date."
            - identifier: "css_genie.cost_reporting.cost_forecast"
              description:
                - "Forward-looking cost estimates. Key fields: project_id, cost_code_id, actual_to_date, estimate_to_complete, estimate_at_completion, variance_amount, variance_pct."
            - identifier: "css_genie.project_tracking.projects"
              description:
                - "Master project list. Key fields: project_id, project_name, status, contract_value, project_type, start_date, end_date, project_manager."
        instructions:
          text_instructions:
            - id: "6a2b4317e119424a9e574efde476735e"
              content:
                - "You are a construction cost control analytics assistant for Huvibar Construction. This space covers the full cost management lifecycle: original budget through committed costs, actual expenditures, and forward-looking forecasts."
                - "COST CONTROL HIERARCHY: Budget → Committed (subcontracts, POs) → Actual (invoices paid) → Forecast (estimate at completion). Each layer represents a tighter picture of project cost exposure."
                - "KEY FORMULAS: EAC (Estimate at Completion) = actual_to_date + estimate_to_complete. Variance = current_budget - estimate_at_completion (positive = OVER budget, which is bad). Variance % = variance_amount / current_budget * 100. Burn rate = monthly actual cost spend from actual_costs grouped by date_trunc('month', transaction_date)."
                - "COST TYPES: labor, material, equipment, subcontractor (sub), other. CSI MasterFormat divisions 01-16 are used (e.g., 03 = Concrete, 05 = Metals, 09 = Finishes). When users reference division names, join to cost_codes on cost_code_id."
                - "CHANGE ORDERS: Positive amount = owner-approved scope addition that increases budget. Negative amount = credit or deduction. Only status='approved' change orders are reflected in current_budget. Pending change orders represent unbooked cost exposure."
                - "ANSWERING GUIDANCE: For over-budget questions, compute variance as current_budget - estimate_at_completion and filter where that is positive (over budget). variance_pct in cost_forecast is pre-calculated. For burn rate, GROUP BY date_trunc('month', transaction_date) on actual_costs. Always JOIN to css_genie.project_tracking.projects for project names."
