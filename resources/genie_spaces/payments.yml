resources:
  genie_spaces:
    huvibar_payments:
      display_name: "Huvibar | Payment Pipeline"
      warehouse_id: ${var.warehouse_id}
      description: "AIA payment application pipeline, retainage tracking, lien waiver management, and cash flow visibility across all Huvibar projects."
      instructions: |
        You are a payment pipeline analytics assistant for Huvibar Construction. Huvibar submits payment applications to owners following the AIA G702/G703 format, the construction industry standard for monthly pay requests.

        **Payment application process:**
        Pay applications move through a defined status workflow: draft → submitted → approved → paid. The submitted_date and paid_date fields record when each transition occurred.

        **Data available:**
        - pay_applications: Monthly pay requests with application_id, project_id, application_number, period_end_date, submitted_date, approved_date, paid_date, work_completed_to_date, materials_stored, retainage_amount, amount_due, and status.
        - schedule_of_values (SOV): Line-item breakdown of the contract value with sov_id, pay_application_id, description, scheduled_value, work_completed_pct, and retainage_pct.
        - lien_waivers: Waivers tied to pay applications with type ('conditional' or 'unconditional'), executed_date, and amount.
        - payment_ledger: Actual cash receipts and disbursements with ledger_id, project_id, pay_application_id, transaction_date, amount, and transaction_type.
        - projects: Master project reference.

        **Retainage rules:**
        - Retainage is typically withheld at 10% of each pay application until substantial completion, then often reduced to 5%.
        - retainage_amount in pay_applications is the cumulative retainage held.
        - Total retainage released is visible in the payment_ledger as transaction_type = 'retainage_release'.

        **Lien waiver types:**
        - Conditional: Provided with the pay request; takes effect only upon actual payment.
        - Unconditional: Provided after payment is received; final waiver of lien rights for amounts paid.

        **Key metrics:**
        - Outstanding AR: SUM(amount_due) WHERE status IN ('submitted', 'approved').
        - Retainage balance: SUM(retainage_amount) WHERE status != 'paid'.
        - Days to payment: DATEDIFF(paid_date, submitted_date).

        **Answering guidance:**
        - Always filter by status carefully — 'paid' applications are historical; 'submitted' and 'approved' represent open receivables.
        - When users ask about cash flow, reference both amount_due (pending) and payment_ledger (received).
        - JOIN to projects for named project context.
      tables:
        - name: "${var.catalog}.payments.pay_applications"
        - name: "${var.catalog}.payments.schedule_of_values"
        - name: "${var.catalog}.payments.lien_waivers"
        - name: "${var.catalog}.payments.payment_ledger"
        - name: "${var.catalog}.project_tracking.projects"
      verified_queries:
        - name: "Outstanding pay applications"
          description: "All submitted or approved pay applications with the amount due and number of days since submission."
          query: |
            SELECT
              p.project_name,
              pa.application_number,
              pa.submitted_date,
              pa.status,
              pa.amount_due,
              pa.retainage_amount,
              DATEDIFF(current_date(), pa.submitted_date) AS days_since_submitted
            FROM ${var.catalog}.payments.pay_applications pa
            JOIN ${var.catalog}.project_tracking.projects p
              ON pa.project_id = p.project_id
            WHERE pa.status IN ('submitted', 'approved')
            ORDER BY days_since_submitted DESC

        - name: "Retainage balance by project"
          description: "Total retainage currently held (not yet paid) per project."
          query: |
            SELECT
              p.project_name,
              pa.project_id,
              SUM(pa.retainage_amount) AS retainage_held,
              COUNT(pa.application_id) AS application_count
            FROM ${var.catalog}.payments.pay_applications pa
            JOIN ${var.catalog}.project_tracking.projects p
              ON pa.project_id = p.project_id
            WHERE pa.status != 'paid'
            GROUP BY p.project_name, pa.project_id
            ORDER BY retainage_held DESC

        - name: "Average days to payment by project"
          description: "Average elapsed days between pay application submission and payment receipt, grouped by project."
          query: |
            SELECT
              p.project_name,
              pa.project_id,
              COUNT(pa.application_id)                              AS paid_applications,
              ROUND(AVG(DATEDIFF(pa.paid_date, pa.submitted_date)), 1) AS avg_days_to_payment,
              MIN(DATEDIFF(pa.paid_date, pa.submitted_date))        AS min_days,
              MAX(DATEDIFF(pa.paid_date, pa.submitted_date))        AS max_days
            FROM ${var.catalog}.payments.pay_applications pa
            JOIN ${var.catalog}.project_tracking.projects p
              ON pa.project_id = p.project_id
            WHERE pa.paid_date IS NOT NULL
            GROUP BY p.project_name, pa.project_id
            ORDER BY avg_days_to_payment DESC
