resources:
  genie_spaces:
    huvibar_project_tracking:
      display_name: "Huvibar | Project Tracking"
      warehouse_id: ${var.warehouse_id}
      description: "Master project status, milestone schedule health, RFI and submittal tracking, daily reports, and closeout punch list management across Huvibar's portfolio."
      instructions: |
        You are a project tracking analytics assistant for Huvibar Construction. This space provides visibility into the operational health of all 25 active projects spanning 2020–2025, with contract values ranging from $5M to $150M.

        **Data available:**
        - projects: Master list with project_id, project_name, owner, contract_value, contract_type, start_date, planned_completion_date, actual_completion_date, and status.
        - milestones: 8 standard milestones per project (e.g., NTP, foundation complete, structure complete, MEP rough-in, substantial completion) with milestone_id, project_id, milestone_name, planned_date, actual_date, and status.
        - rfis: Requests for Information with rfi_id, project_id, rfi_number, subject, submitted_date, required_response_date, responded_date, days_open (pre-calculated), ball_in_court, and status.
        - submittals: Shop drawing and product data submissions with submittal_id, project_id, spec_section, submittal_type, submitted_date, returned_date, status, and revision_number.
        - daily_reports: Weather and field conditions log with report_id, project_id, report_date, weather_conditions, temperature_high, temperature_low, total_headcount, and superintendent_notes.
        - punch_list_items: Closeout deficiency items with item_id, project_id, description, priority, assigned_to, created_date, completed_date, and status.

        **RFI guidance:**
        - Industry SLA for RFI response is 14 days.
        - days_open is pre-calculated — no date arithmetic needed.
        - ball_in_court indicates who currently owes a response: 'contractor', 'owner', 'architect', or 'engineer'.
        - Filter status = 'open' for active RFIs; status = 'closed' for resolved.

        **Submittal types:** shop_drawing, product_data, sample, closeout.
        **Submittal status flow:** pending → submitted → under_review → approved / approved_as_noted / revise_resubmit / rejected.

        **Milestone schedule health:**
        - If actual_date IS NULL and planned_date < current_date(), the milestone is late.
        - DATEDIFF(actual_date, planned_date) gives variance in days (positive = late).

        **Punch list priorities:** critical, high, medium, low.

        **Answering guidance:**
        - When users ask about a specific project, JOIN on project_name if they use the name.
        - For schedule questions, compare planned_date vs actual_date in milestones.
        - For RFI aging, use days_open directly rather than recomputing from submitted_date.
        - Submittal spec_section follows CSI format (e.g., '03 30 00' for cast-in-place concrete).
      tables:
        - name: "${var.catalog}.project_tracking.projects"
        - name: "${var.catalog}.project_tracking.milestones"
        - name: "${var.catalog}.project_tracking.rfis"
        - name: "${var.catalog}.project_tracking.submittals"
        - name: "${var.catalog}.project_tracking.daily_reports"
        - name: "${var.catalog}.project_tracking.punch_list_items"
      verified_queries:
        - name: "Open RFIs over 14 days"
          description: "All open RFIs that have exceeded the 14-day industry response SLA, sorted by longest outstanding first."
          query: |
            SELECT
              p.project_name,
              r.rfi_number,
              r.subject,
              r.submitted_date,
              r.days_open,
              r.ball_in_court,
              r.required_response_date
            FROM ${var.catalog}.project_tracking.rfis r
            JOIN ${var.catalog}.project_tracking.projects p
              ON r.project_id = p.project_id
            WHERE r.status = 'open'
              AND r.days_open > 14
            ORDER BY r.days_open DESC

        - name: "Milestone schedule health"
          description: "All project milestones with planned vs. actual dates and schedule variance in days."
          query: |
            SELECT
              p.project_name,
              m.milestone_name,
              m.planned_date,
              m.actual_date,
              m.status,
              CASE
                WHEN m.actual_date IS NOT NULL
                  THEN DATEDIFF(m.actual_date, m.planned_date)
                WHEN m.planned_date < current_date()
                  THEN DATEDIFF(current_date(), m.planned_date)
                ELSE NULL
              END                        AS days_variance,
              CASE
                WHEN m.actual_date IS NOT NULL AND m.actual_date <= m.planned_date THEN 'On Time'
                WHEN m.actual_date IS NOT NULL AND m.actual_date > m.planned_date  THEN 'Completed Late'
                WHEN m.actual_date IS NULL AND m.planned_date >= current_date()    THEN 'Upcoming'
                ELSE 'Overdue'
              END                        AS schedule_status
            FROM ${var.catalog}.project_tracking.milestones m
            JOIN ${var.catalog}.project_tracking.projects p
              ON m.project_id = p.project_id
            ORDER BY p.project_name, m.planned_date

        - name: "Submittal register by status"
          description: "Count of submittals grouped by current status and spec section."
          query: |
            SELECT
              p.project_name,
              s.spec_section,
              s.submittal_type,
              s.status,
              COUNT(s.submittal_id) AS submittal_count
            FROM ${var.catalog}.project_tracking.submittals s
            JOIN ${var.catalog}.project_tracking.projects p
              ON s.project_id = p.project_id
            GROUP BY p.project_name, s.spec_section, s.submittal_type, s.status
            ORDER BY p.project_name, s.spec_section, s.status
