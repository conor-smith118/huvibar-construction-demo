resources:
  genie_spaces:
    huvibar_safety:
      title: "Huvibar | Safety & Compliance"
      description: "OSHA incident rates (TRIR, LTIR, DART), toolbox talk compliance, safety inspection scores, and employee certification tracking across Huvibar's jobsites."
      warehouse_id: ${var.warehouse_id}
      serialized_space:
        version: 2
        config:
          sample_questions:
            - id: "f3a2b1c4d5e647f8a9b0c1d2e3f40516"
              question:
                - "What is our TRIR year to date?"
            - id: "a1b2c3d4e5f6478890a1b2c3d4e5f647"
              question:
                - "Which employees have certifications expiring in the next 60 days?"
            - id: "b2c3d4e5f607489a01b2c3d4e5f60748"
              question:
                - "What's the average safety inspection score by project over the last 90 days?"
        data_sources:
          tables:
            - identifier: "css_genie.project_tracking.employees"
              description:
                - "Employee master record. Key fields: employee_id, first_name, last_name, role, department, trade, hire_date, employment_type, active."
            - identifier: "css_genie.project_tracking.projects"
              description:
                - "Master project list. Key fields: project_id, project_name, status, contract_value, project_type, start_date, end_date, project_manager."
            - identifier: "css_genie.safety_compliance.certifications"
              description:
                - "Employee credential records. Key fields: cert_id, employee_id, cert_type, issued_date, expiry_date, status. Common cert_types: OSHA 10, OSHA 30, First Aid/CPR, Forklift, Rigging, Scaffold, Confined Space."
            - identifier: "css_genie.safety_compliance.incidents"
              description:
                - "Incident records. Key fields: incident_id, project_id, employee_id, incident_date, incident_type, osha_recordable (boolean), lost_time (boolean), days_away, days_restricted, description, corrective_action."
            - identifier: "css_genie.safety_compliance.safety_inspections"
              description:
                - "Jobsite inspection records. Key fields: inspection_id, project_id, inspection_date, inspector_name, score (0-100), findings_count, corrective_actions_required. Score thresholds: 85-100 acceptable, 70-84 needs improvement, below 70 triggers corrective action plan."
            - identifier: "css_genie.safety_compliance.toolbox_talks"
              description:
                - "Safety meeting records. Key fields: talk_id, project_id, talk_date, topic, presenter, attendee_count, duration_minutes, foreman_signature."

        instructions:
          text_instructions:
            - id: "6e5832c3de9640d488b54d82469b97c1"
              content:
                - "You are a safety and compliance analytics assistant for Huvibar Construction. This space covers all occupational safety data including OSHA recordable incidents, safety inspections, toolbox talks, and employee certification compliance."
                - "OSHA RATE FORMULAS (per 200,000 exposure hours — equivalent to 100 full-time workers for one year): TRIR (Total Recordable Incident Rate) = (recordable_incidents × 200,000) / total_hours_worked. Industry average for construction is ~2.5; below 1.0 is excellent. LTIR (Lost Time Incident Rate) = (lost_time_incidents × 200,000) / total_hours_worked. DART Rate (Days Away, Restricted, or Transferred) = (dart_cases × 200,000) / total_hours_worked."
                - "HOURS SOURCE: For TRIR/LTIR/DART calculations, get total exposure hours from css_genie.scheduling.daily_manpower_log — SUM(total_hours) for the relevant time period. This table is in the scheduling schema, not safety_compliance. Use a subquery or CTE to pull total hours."
                - "INCIDENT CLASSIFICATION: osha_recordable = true for TRIR numerator. lost_time = true for LTIR numerator. DART cases = incidents where days_away > 0 OR days_restricted > 0 OR a job transfer occurred. Always specify the time period when calculating rates (YTD, trailing 12 months, etc.)."
                - "CERTIFICATION COMPLIANCE: Expired = expiry_date < current_date(). Expiring soon = expiry_date BETWEEN current_date() AND date_add(current_date(), 60). Common cert_types: OSHA 10, OSHA 30, First Aid/CPR, Forklift, Rigging, Scaffold, Confined Space. Filter to active employees (active = true) to exclude terminated workers."
                - "SAFETY INSPECTION SCORING: Score 85-100 is acceptable. Score 70-84 needs improvement. Score below 70 triggers a mandatory corrective action plan. For trend analysis, group by inspection_date truncated to week or month."
                - "ANSWERING GUIDANCE: JOIN employees on employee_id to show names in incident or certification queries. JOIN projects on project_id for project context. Toolbox talk training hours = attendee_count * duration_minutes / 60.0. For YTD, filter WHERE YEAR(date_field) = YEAR(current_date()). For trailing 90 days, use WHERE inspection_date >= date_sub(current_date(), 90)."
